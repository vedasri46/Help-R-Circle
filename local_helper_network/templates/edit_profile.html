{% extends "base.html" %}

{% block title %}Edit Profile — Help R Circle{% endblock %}

{% block content %}
<section class="page-hero page-hero-purple">
  <div class="container">
    <h1><i class="fas fa-edit"></i> Edit Profile</h1>
    <p>Update your personal information.</p>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width: 640px;">
    <div class="form-card">
      <form method="POST" class="lhn-form">
        
        <div class="form-group">
          <label for="username"><i class="fas fa-user"></i> Username</label>
          <input type="text" id="username" name="username" 
                 value="{{ user['username'] }}" required/>
          <small>3+ characters</small>
        </div>

        <div class="form-group">
          <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
          <input type="email" id="email" name="email" 
                 value="{{ user['email'] }}" required/>
        </div>

        <div class="form-group">
          <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
          <input type="tel" id="phone" name="phone" 
                 placeholder="Optional" />
        </div>

        <div class="form-group">
          <label for="location"><i class="fas fa-map-marker-alt"></i> Location</label>
          <input type="text" id="location" name="location" 
                 placeholder="Optional" />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-full">
            <i class="fas fa-save"></i> Save Changes
          </button>
          <a href="{{ url_for('profile') }}" class="btn btn-outline btn-full">
            <i class="fas fa-times"></i> Cancel
          </a>
        </div>

      </form>
    </div>
  </div>
</section>

<style>
.form-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 32px;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border);
}

.form-card h2 {
  margin-bottom: 24px;
  font-size: 1.8rem;
}

.lhn-form {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-group label {
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
}

.form-group input,
.form-group textarea {
  padding: 12px 14px;
  border: 1px solid var(--border-dark);
  border-radius: var(--radius-sm);
  font-size: 1rem;
  font-family: inherit;
  transition: all 0.3s ease;
}

.form-group input:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(232, 93, 4, .1);
}

.form-group small {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 4px;
}

.form-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.btn {
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  transition: all 0.3s ease;
  font-size: 1rem;
}

.btn-full {
  width: 100%;
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}

.btn-primary:hover {
  background: var(--primary-dark);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.btn-outline {
  background: transparent;
  border: 1px solid var(--border-dark);
  color: var(--text);
}

.btn-outline:hover {
  background: var(--bg-tinted);
  border-color: var(--text);
}

@media (max-width: 760px) {
  .form-card {
    padding: 24px;
  }

  .form-actions {
    flex-direction: column;
  }
}
</style>
{% endblock %}
